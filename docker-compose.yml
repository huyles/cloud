version: '3.8'

services:
  flashdrop-frontend:
    build: 
      context: .
      args:
        # Pass environment variables as build args
        REACT_APP_BROWSE_API_URL: ${REACT_APP_BROWSE_API_URL:-http://localhost:3001/api}
        REACT_APP_INVENTORY_API_URL: ${REACT_APP_INVENTORY_API_URL:-http://localhost:3002/api}
        REACT_APP_S3_BUCKET_URL: ${REACT_APP_S3_BUCKET_URL:-}
        REACT_APP_COGNITO_USER_POOL_ID: ${REACT_APP_COGNITO_USER_POOL_ID:-}
        REACT_APP_COGNITO_CLIENT_ID: ${REACT_APP_COGNITO_CLIENT_ID:-}
        REACT_APP_COGNITO_REGION: ${REACT_APP_COGNITO_REGION:-us-east-1}
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped