  ModLabRole:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: ModLabRole
      Code:
        ZipFile: !Sub |
          import json
          import boto3
          import cfnresponse
          def lambda_handler(event, context):
            account_id=boto3.client('sts').get_caller_identity().get('Account')
            inject_str='"Principal": { "AWS": ["arn:aws:iam::ACTUAL-ACCOUNT-ID:role/LabRole"],'
            inject_str = inject_str.replace('ACTUAL-ACCOUNT-ID', account_id)
            #print('inject_str = ' + inject_str)
            client = boto3.client('iam')
            response = client.get_role(RoleName='LabRole')
            #print(json.dumps(response, indent=4, default=str))
            document = str(response['Role']['AssumeRolePolicyDocument'])
            document = document.replace("'","\"")
            document = document.replace('"Principal": {', inject_str)
            #print('new doc = ' + document)
            response = client.update_assume_role_policy(RoleName='LabRole',PolicyDocument=document)
            #BOILER PLATE BELOW
            responseData = {}
            responseData['Data'] = 'success'
            response_status = cfnresponse.SUCCESS
            #logger.info('Sending responseData: {}'.format(json.dumps(responseData)))
            cfnresponse.send(event, context, response_status, responseData )
      Description: updates LabRole to allow it to assume itself
      Handler: index.lambda_handler
      Role: !GetAtt RoleForLambdaModLabRole.Arn
      MemorySize: 128
      Timeout: 60
      Runtime: python3.10

