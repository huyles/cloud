                "sqlworkbench:*",
                "sqs:*",
                "ssm:*",
                "ssmmessages:*",
                "states:*",
                "sts:AssumeRole",
                "sts:Get*",
                "swf:*",
                "tag:*",
                "textract:*",
                "trustedadvisor:*",
                "waf:*",
                "waf-regional:*",
                "wafv2:*",
                "wellarchitected:*"
            ],
            "Resource": "*",
            "Condition": {
                "StringEquals": {
                    "aws:RequestedRegion": [
                        "us-east-1",
                        "us-west-2"
                    ]
                }
            }
        }]

  VocLabPolicy2:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    Properties:
      Description: String
      Roles:
        - !Ref LabRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement: [
          {
            "Sid": "IamAllowPassLabRole",
            "Effect": "Allow",
            "Action": [
                "iam:PassRole"
            ],
            "Resource": [
                "arn:aws:iam::*:role/LabRole",
                "arn:aws:iam::*:role/LabInstanceProfile",
                "arn:aws:iam::*:role/aws-service-role/*.amazonaws.com/*",
                "arn:aws:iam::*:role/EMR_DefaultRole",
                "arn:aws:iam::*:role/EMR_DefaultRole_V2",
                "arn:aws:iam::*:role/EMR_EC2_DefaultRole",
                "arn:aws:iam::*:role/EMR_AutoScaling_DefaultRole",
                "arn:aws:iam::*:role/myRedshiftRole"
            ],
            "Condition": {
                "StringLike": {
                    "iam:PassedToService": [
                        "*.amazonaws.com"
                    ]
                }
            }
          },
          {
            "Effect": "Allow",
            "Action": "iam:PassRole",
            "Resource": [
                "arn:aws:iam::*:role/EMR_Notebooks_DefaultRole",
                "arn:aws:iam::*:role/LabRole"
            ]
          },
          {
            "Effect": "Allow",
            "Action": [
                "iam:PutRolePolicy",
                "iam:GetRolePolicy"
            ],
            "Resource": "arn:aws:iam::*:role/aws-service-role/*.amazonaws.com/*"
          },
          {
            "Sid": "IamAllowServiceLinkedRoleCreation",
            "Effect": "Allow",
            "Action": "iam:CreateServiceLinkedRole",
            "Resource": "arn:aws:iam::*:role/aws-service-role/*"
          },
          {
              "Sid": "IamLimited",
              "Effect": "Allow",
              "Action": [
                "iam:AddRoleToInstanceProfile",
                "iam:CreateInstanceProfile",
                "iam:CreatePolicy",
                "iam:DeleteInstanceProfile",
                "iam:DeletePolicy",
                "iam:DeleteRole",
                "iam:DeleteRolePolicy",
                "iam:DeleteServiceLinkedRole",
                "iam:Get*",
                "iam:List*",
                "iam:*LoginProfile",
                "iam:Remove*",
                "iam:Sim*",
                "iam:UpdateRoleDescription",
                "iam:UploadServerCertificate"
              ],
              "Resource": "*"
          },
          {
              "Sid": "IamNoView",
              "Effect": "Deny",
              "Action": [
                  "iam:Delete*",
                  "iam:Update*"
              ],
              "Resource": [
                  "arn:aws:iam::*:policy/*VocLabPolicy*",
                  "arn:aws:iam::*:role/LabRole",
                  "arn:aws:iam::*:role/myRedshiftRole",
                  "arn:aws:iam::*:role/RedshiftRole",
                  "arn:aws:iam::*:role/LambdaSLRRole",
                  "arn:aws:iam::*:role/RoleForLambdaModLabRole"
              ]
          },
          {
              "Sid": "PermsAndMonitoringNoView",
              "Effect": "Deny",
              "Action": "*",
              "Resource": [
                "arn:aws:events:*:*:rule/*MonitoringRule*",
                "arn:aws:events:*:*:rule/resourceFunctionRule",
                "arn:aws:iam::*:policy/*VocLabPolicy*",
                "arn:aws:iam::*:role/RoleForLambdaModLabRole",
                "arn:aws:lambda:*:*:function:*MonitoringFunction*",
                "arn:aws:lambda:*:*:function:RedshiftOverwatch",
                "arn:aws:lambda:*:*:function:RedshiftEventSubscription",
                "arn:aws:lambda:*:*:function:RoleCreationFunction",
                "arn:aws:lambda:*:*:function:ModLabRole",
                "arn:aws:logs:*:*:log-group:/aws/lambda/*MonitoringFunction:*",
                "arn:aws:sns:*:*:RedshiftSNS"
              ]
          },
          {
              "Sid": "AllServicesDenyNoConds",
              "Effect": "Deny",
              "Action": [
                  "codebuild:Update*",
                  "codebuild:Create*",
                  "codebuild:Batch*",
                  "dynamodb:*Reserved*",
                  "ec2:*Fpga*",
                  "ec2:*Spot*",
                  "ec2:*ReservedInstances*",
                  "ec2:*Scheduled*",
                  "ec2:*Purchase*",
                  "ec2:CreateFleet",
                  "ec2:EnableFastSnapshotRestores",
                  "glacier:*VaultLock",
                  "rds:Purchase*",
                  "redshift:AcceptReservedNodeExchange",
                  "redshift:PurchaseReservedNodeOffering",
                  "route53domains:RegisterDomain",
                  "s3:*ObjectLegalHold",
                  "s3:*ObjectRetention",
                  "s3:PutBucketObjectLockConfiguration"
              ],
              "Resource": "*"
          },
          {
              "Sid": "AsgRestrict",
              "Action": [
                  "autoscaling:CreateLaunchConfiguration"
              ],
              "Effect": "Deny",
              "Resource": "*",
              "Condition": {
                  "ForAnyValue:StringNotLike": {
                      "autoscaling:InstanceType": [
                          "*.nano",
                          "*.small",
                          "*.micro",
                          "*.medium",
                          "*.large"
                      ]
                  }
              }
          },
          {
              "Sid": "RestrictCloud9",
              "Effect": "Deny",
              "Action": [
                  "cloud9:UpdateEnvironment*",
                  "cloud9:CreateEnvironment*"
              ],
              "Resource": "*",
              "Condition": {
                  "ForAnyValue:StringNotLikeIfExists": {
                      "cloud9:InstanceType": [
                          "*.nano",
                          "*.micro",
                          "*.small",
                          "*.medium",
                          "*.large",
                          "c4.xlarge"
                      ]
                  }
              }
          },
          {
            "Sid": "ec2NoSpot",
            "Effect": "Deny",
            "Action": "ec2:RunInstances",
            "Resource": "*",
            "Condition": {
                "ForAnyValue:StringEqualsIfExists": {
                    "ec2:InstanceMarketType": "spot"
                }
            }
        },
          {
              "Sid": "Ec2RestrictPlacementGroup",
              "Action": "ec2:*Instance*",
              "Effect": "Deny",
              "Resource": "*",
              "Condition": {
                  "StringEquals": {
                      "ec2:PlacementGroupStrategy": "cluster"
                  }
              }
          },
          {
              "Sid": "Ec2DenyTenancy",
              "Action": "ec2:*Instance*",
              "Effect": "Deny",
              "Resource": "arn:aws:ec2:*:*:instance/*",
              "Condition": {
                  "StringNotLike": {
                      "ec2:Tenancy": "default"
                  }
              }
          },
          {
              "Sid": "Ec2RestrictInstanceTypes",
              "Action": [
                  "ec2:RunInstances",
                  "ec2:StartInstances"
              ],
              "Effect": "Deny",
              "Resource": "arn:aws:ec2:*:*:instance/*",
              "Condition": {
                  "ForAnyValue:StringNotLike": {
                      "ec2:InstanceType": [
                          "*.nano",
                          "*.micro",
                          "*.small",
                          "*.medium",
                          "*.large"
                      ]
                  }
              }
          },
          {
              "Sid": "Ec2RestrictLargeVolumes",
              "Action": [
                  "ec2:RunInstances",
                  "ec2:CreateVolume"
              ],
              "Effect": "Deny",
              "Resource": "arn:aws:ec2:*:*:volume/*",
              "Condition": {
                  "NumericGreaterThanIfExists": {
                      "ec2:VolumeSize": "101"
                  }
              }
          },
          {
              "Sid": "Ec2RestrictPIOPSVolumes",
              "Action": [
                  "ec2:RunInstances",
                  "ec2:CreateVolume"
              ],
              "Effect": "Deny",
              "Resource": "arn:aws:ec2:*:*:volume/*",
              "Condition": {
                  "StringNotLikeIfExists": {
                      "ec2:VolumeType": [
                          "gp2",
                          "gp3",
                          "sc1",
                          "standard"
                      ]
                  }
              }
          }]

  VocLabPolicy3:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    Properties:
      Description: String
      Roles:
        - !Ref LabRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement: [
          {
              "Sid": "RdsRestrictPiops",
              "Action": [
                  "rds:CreateDBInstance",
                  "rds:CreateDBInstanceReadReplica",
                  "rds:CreateGlobalCluster",
                  "rds:StartDB*",
                  "rds:ModifyDBCluster",
                  "rds:ModifyCurrentDBClusterCapacity",
                  "rds:ModifyDBInstance",
                  "rds:ModifyGlobalCluster",
                  "rds:RestoreDB*",
                  "rds:RebootDBInstance"
              ],
              "Effect": "Deny",
              "Resource": "*",
              "Condition": {
                "ForAnyValue:NumericGreaterThanIfExists": {
                    "rds:Piops": "100",
                    "rds:StorageSize": "101"
                }
              }
          },
          {
              "Sid": "RdsAllowAllAsLongAs",
              "Action": [
                  "rds:*"
              ],
              "Effect": "Allow",
              "Resource": "*",
              "Condition": {
                  "ForAnyValue:StringLikeIfExists": {
                      "rds:DatabaseClass": [
                          "*.nano",
                          "*.small",
                          "*.micro",
                          "*.medium"
                      ],
                      "rds:DatabaseEngine": [
                          "aurora-mysql",
                          "aurora-postgresql",
                          "mysql",
                          "postgres",
                          "mariadb",
                          "oracle-*",
                          "sqlserver-*"
                      ],
                      "aws:RequestedRegion": [
                          "us-east-1",
                          "us-west-2"
                      ]
                  }
              }
          },
          {
              "Sid": "SmAllowSpecificModelTraining",
              "Effect": "Deny",
              "Action": [
                  "sagemaker:CreateApp",
                  "sagemaker:CreateEndpointConfig",
                  "sagemaker:CreateExperiment",
                  "sagemaker:CreateHyperParameterTuningJob",
                  "sagemaker:CreateModel",
                  "sagemaker:CreateNotebookInstance",
                  "sagemaker:CreateProcessingJob",
                  "sagemaker:CreateTrainingJob",
                  "sagemaker:CreateTransformJob",
                  "sagemaker:UpdateNotebookInstance",
                  "sagemaker:UpdateTrainingJob"
              ],
              "Resource": "*",
              "Condition": {
                  "ForAnyValue:StringNotLike": {
                      "sagemaker:InstanceTypes": [
                          "ml.t3.medium",
                          "ml.t3.large",
                          "ml.t3.xlarge",
                          "ml.m5.large",
                          "ml.m5.xlarge",
                          "ml.c5.large",
                          "ml.c5.xlarge"
                      ]
                  }
              }
          }]

