  InvokeRCF:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: RoleCreationFunction
    Version: "1.0"
    Properties:
      ServiceToken: !GetAtt RoleCreationFunction.Arn

  RoleCreationFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    Properties:
      Description: Create SLR if absent
      FunctionName: RoleCreationFunction
      Handler: index.lambda_handler
      Role: !GetAtt 'LambdaSLRRole.Arn'
      Runtime: python3.10
      Timeout: 300
      Code:
        ZipFile: !Sub |
          import boto3
          import json
          import time 
          import cfnresponse
          def lambda_handler(event, context):
            session = boto3.Session()
            iam_client = session.client('iam')
            response = iam_client.list_roles()
            notebookRoleFound = False
            for i in response['Roles']:
                if i['RoleName'] == "EMR_Notebooks_DefaultRole":
                    notebookRoleFound = True
            if notebookRoleFound != True:
                TrustPolicy = {"Version": "2008-10-17","Statement": [{"Effect": "Allow","Principal": {"Service": "elasticmapreduce.amazonaws.com"},"Action": "sts:AssumeRole"}]}
                create_role_response = iam_client.create_role(
                    Path='/',
                    RoleName='EMR_Notebooks_DefaultRole',
                    AssumeRolePolicyDocument=json.dumps(TrustPolicy),
                    Description='EMR_Notebooks_DefaultRole'
                )
                time.sleep(3)
                attach_role_response = iam_client.attach_role_policy(
                    RoleName='EMR_Notebooks_DefaultRole',
                    PolicyArn='arn:aws:iam::aws:policy/service-role/AmazonElasticMapReduceEditorsRole'
                )
                attach_role_response = iam_client.attach_role_policy(
                    RoleName='EMR_Notebooks_DefaultRole',
                    PolicyArn='arn:aws:iam::aws:policy/AmazonS3FullAccess'
                )
            cfnresponse.send(event, context, cfnresponse.SUCCESS, {"test_response_1": "It worked"})
     
  LambdaSLRRole:
