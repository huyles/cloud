      Roles:
      - !Ref myRedshiftRole

  ##RedshiftOverwatch - 8 resources 
  RedshiftRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    Properties:
      RoleName: RedshiftRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: "Iam_Policies"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - redshift:DeleteCluster
                  - redshift:DescribeClusters
                  - redshift:CreateEventSubscription
                  - redshift:DeleteEventSubscription
                  - redshift:ModifyEventSubscription
                  - redshift:CreateTags
                Resource:
                  - "*"
  
  RedshiftOverwatch:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: RedshiftOverwatch
      Code:
        ZipFile: !Sub |
          import json
          import boto3
          from datetime import datetime
          import urllib3
          import random
          import logging
          http = urllib3.PoolManager()
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          allowed_node_size = ['ra3.large']
          allowed_node_count = 2
          redshift_client = boto3.client('redshift')
          def lambda_handler(event, context):
              logger.info(event)
              try:
                  response_describe_redshift = redshift_client.describe_clusters()
                  logger.info(response_describe_redshift)
                  redshift_cluster_list = []
                  # Get list of redshift clusters and delete if the node size is different.
                  for item in response_describe_redshift['Clusters']:
                      cluster = item.get('ClusterIdentifier')
                      node_type = item.get('NodeType')
                      for size in allowed_node_size:
                        if node_type != size:
                            logger.info("Not allowed size")
                            delete_cluster(cluster)
                        elif item.get('NumberOfNodes') > allowed_node_count:
                            logger.info("Node count is more than allowed value")
                            delete_cluster(cluster)
                        else:
                            redshift_cluster_list.append(cluster)
                  logger.info(redshift_cluster_list)
                  try:
                      # Generate random number
                      if len(redshift_cluster_list) < 2:
                          rand_num = 1
                      else:
                          rand_num = random.randint(0,len(redshift_cluster_list)-1)
                          logger.info(rand_num)
                      # If the cluster count is more than 1, random cluster will be deleted.
                      if len(redshift_cluster_list) > 1:
                          logger.info('bad and we are deleting:'+redshift_cluster_list[rand_num])
                          delete_cluster(redshift_cluster_list[rand_num])
                      else:
                          logger.info('good - no need to delete')
                  except Exception as exp:
                      logger.exception(exp)
              except Exception as exp:
                  logger.exception(exp)
          # Function to delete Cluster
          def delete_cluster(ClusterID):
              try:
                  response_delete = redshift_client.delete_cluster(
                      ClusterIdentifier=ClusterID,
                      SkipFinalClusterSnapshot=True
                      )
                  logger.info(response_delete)
              except  Exception as exp:
                  logger.exception(exp)
      Description: Deletes Redshift Cluster if the count is more than 2.
      Handler: index.lambda_handler
      Role: !GetAtt RedshiftRole.Arn
      MemorySize: 128
      Timeout: 60
      Runtime: python3.10
  
  RedshiftSNS:
    Type: AWS::SNS::Topic
    DeletionPolicy: Retain
    Properties:
      TopicName: "RedshiftSNS"
      Subscription:
        - Endpoint:
            Fn::GetAtt:
              - "RedshiftOverwatch"
              - "Arn"
          Protocol: "lambda" 
  
  SNSTopicPermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    Properties:
      FunctionName: !Ref RedshiftOverwatch
      Action: "lambda:InvokeFunction"
      Principal: "sns.amazonaws.com"
      SourceArn: !Ref RedshiftSNS
  
  resourceFunctionRule: 
    Type: AWS::Events::Rule
    DeletionPolicy: Retain
    Properties:
      Name: "resourceFunctionRule"
      EventPattern: 
        source: 
          - "aws.redshift"
        detail-type: 
          - "AWS API Call via CloudTrail"
        detail: 
          eventSource:
            - redshift.amazonaws.com
      State: "ENABLED"
      Targets: 
        - Arn: !GetAtt RedshiftOverwatch.Arn
          Id: !Ref RedshiftOverwatch

  resourceFunctionRulePermission: 
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    Properties: 
      FunctionName: !Ref RedshiftOverwatch
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt resourceFunctionRule.Arn 
  
  RedshiftEventSubscription:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: RedshiftEventSubscription
      Code:
        ZipFile: !Sub |
          import json
          import boto3
          from datetime import datetime
          import urllib3
          import random
          import logging
          http = urllib3.PoolManager()
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          SUCCESS = "SUCCESS"
          FAILED = "FAILED"
          def lambda_handler(event, context):
              logger.info(event)
              if event['RequestType'] == 'Create':
                  resource_config = event['ResourceProperties']
                  sns_topic = resource_config['snsTopicArn']
                  try:
                      #Generate random number
                      rand_num = random.randint(0,100)
                      logger.info(rand_num)
                      redshift_client = boto3.client('redshift')
                      # Create Redshift Subscription
                      response_create_subscription = redshift_client.create_event_subscription(
                        SubscriptionName='event-subscription-'+str(rand_num),
                        SnsTopicArn=sns_topic,
                        SourceType='cluster',
                       Enabled=True,
                       Tags=[
                          {
                              'Key': 'Name',
                              'Value': 'Redshift_monitor'
                          },
                       ]
                      )
                      send(event, context, SUCCESS, {},physicalResourceId=event['LogicalResourceId'])
                  except Exception as exp:
                      logger.exception(exp)
                      send(event, context, SUCCESS,{}, physicalResourceId='12345678')
              else:
                  logger.info("nothing to do")
                  send(event, context, SUCCESS,{}, physicalResourceId='12345678')
          def send(event, context, responseStatus, responseData, physicalResourceId=None, noEcho=False, error=None):
              responseUrl = event['ResponseURL']
              logger.info(responseUrl)
              responseBody = {}
              responseBody['Status'] = responseStatus
              if error is None: 
                responseBody['Reason'] = 'See the details in CloudWatch Log Stream: ' + context.log_stream_name + ' LogGroup: ' + context.log_group_name
              else:
                responseBody['Reason'] = error
              responseBody['PhysicalResourceId'] = physicalResourceId or context.log_stream_name
              responseBody['StackId'] = event['StackId']
              responseBody['RequestId'] = event['RequestId']
              responseBody['LogicalResourceId'] = event['LogicalResourceId']
              responseBody['NoEcho'] = noEcho
              responseBody['Data'] = responseData
              json_responseBody = json.dumps(responseBody)
              print("Response body:\n" + json_responseBody)
              headers = {
                  'content-type' : '',
                  'content-length' : str(len(json_responseBody))
              }
              try:
                  response = http.request('PUT',responseUrl,body=json_responseBody.encode('utf-8'),headers=headers)
                  print("Status code: " + response.reason)
              except Exception as e:
                  print("send(..) failed executing requests.put(..): " + str(e))
      Description: Create Redshift event subscription to SNS Topic.
      Handler: index.lambda_handler
      Role: !GetAtt RedshiftRole.Arn
      MemorySize: 128
      Timeout: 60
      Runtime: python3.10
  
  InvokeRedshiftEventSubscription:
    Type: 'Custom::InvokeRedshiftEventSubscription'
