  # Function to delete unauthorized EC2 instances.
  MainMonitoringFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: MainMonitoringFunction
      Handler: index.lambda_handler
      Role: !GetAtt 'LabRole.Arn'
      Runtime: python3.10
      Timeout: 300
      Code:
        ZipFile: !Sub |
          import boto3

          def terminate_instance(instance_region, InstanceId):
            try:
                ec2_client = boto3.client('ec2', region_name=instance_region)
                response = ec2_client.terminate_instances(
                    InstanceIds=[
                        InstanceId
                    ],
                #DryRun=True
                )
                print(f"Terminating instance {InstanceId}.\nResponse is {response}")
            except Exception as exception:
                print(f"Encountered exception: {exception}")

          def lambda_handler(event, context):
            try:
                #print(f"Event: {event}")
                # EC2 Section - c4.xlarge allowed for c9 and robo
                allowed_types = ['nano', 'micro', 'small', 'medium', 'large', 'xlarge']
                instance_region = event['region']
                ec2_client = boto3.client('ec2', region_name=instance_region)
                InstanceId = event['detail']['instance-id']
                response = ec2_client.describe_instances(
                    InstanceIds=[
                        InstanceId,
                        ]
                )
                for inst in response['Reservations'][0]['Instances']:
                    instance_type = response['Reservations'][0]['Instances'][0]['InstanceType']
                    instance_size = instance_type.split('.')[1]
                    #Terminate the instance if not one of the allowed sizes
                    if instance_size not in allowed_types:
                        print("Instance size is not nano, micro, small, medium, large, or xlarge. It will be terminated...")
                        terminate_instance(instance_region, InstanceId)

            except Exception as exception:
                print(f"Encountered exception: {exception}")

            print("All operations have completed.")

