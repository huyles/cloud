name: Full CI/CD (Frontend → S3 | Backend → ECR → ECS)

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # ======================================================
    # 1. CHECKOUT CODE
    # ======================================================
    - name: Checkout repository
      uses: actions/checkout@v4

    # ======================================================
    # 2. FRONTEND — VITE BUILD
    # ======================================================
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install frontend dependencies
      run: npm install

    - name: Build frontend
      run: npm run build

    # ======================================================
    # 3. AWS AUTH (LEARNER LAB)
    # ======================================================
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    # ======================================================
    # 4. DEPLOY FRONTEND → USER-CREATED S3 BUCKET
    # ======================================================
    - name: Deploy frontend to S3
      run: |
        aws s3 cp dist s3://flashdrop-frontend-new-1040388305 \
          --recursive \
          --cache-control "no-cache"

    # ======================================================
    # 5. LOGIN TO AMAZON ECR
    # ======================================================
    - name: Login to Amazon ECR
      run: |
        aws ecr get-login-password --region us-east-1 \
        | docker login --username AWS --password-stdin \
        184143007829.dkr.ecr.us-east-1.amazonaws.com

    # ======================================================
    # 6. BUILD & PUSH BACKEND IMAGE
    # ======================================================
    - name: Build and push Docker image
      run: |
        docker build -t flashdrop-dev-cart-service ./cart-service
        docker tag flashdrop-dev-cart-service:latest \
          184143007829.dkr.ecr.us-east-1.amazonaws.com/flashdrop-dev-cart-service:latest
        docker push \
          184143007829.dkr.ecr.us-east-1.amazonaws.com/flashdrop-dev-cart-service:latest

    # ======================================================
    # 7. FORCE ECS FARGATE REDEPLOY
    # ======================================================
    - name: Force ECS redeploy
      run: |
        aws ecs update-service \
          --cluster flashdrop-dev-cluster \
          --service flashdrop-dev-cart-service \
          --force-new-deployment
